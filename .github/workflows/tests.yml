# Runs the whole test suite on Linux after every push and on every pull request.
# A second operating system and a newer compiler than the Windows laptop the engine was built
# on. The expected outputs are fixed, so passing here also shows that the output doesn't
# depend on the platform.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show the compiler version
        run: g++ --version

      - name: Build and run every test, the stress checks and the differential test
        shell: bash
        run: |
          # GitHub runs bash with -e (stop at the first failure), so catch the status by hand:
          # the lines below must run even when the tests fail.
          status=0
          python run_tests.py > test-output.txt 2>&1 || status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            # Show failures as annotations, so they appear on the run's summary page.
            { grep -E "^FAIL|error:|Error|failed to build|Build failed" test-output.txt || true; } |
              head -6 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 4 test-output.txt | while IFS= read -r line; do echo "::error::(last lines) $line"; done
          fi
          exit "$status"
